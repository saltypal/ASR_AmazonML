[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "amazon-business-entity-resolution"
version = "0.1.0"
description = "Reproducible multilingual business entity resolution pipeline for the Amazon ML Challenge 2026"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = {text = "Apache-2.0"}
dependencies = [
  "numpy==1.26.4",
  "pandas==2.2.3",
  "pyarrow==19.0.1",
  "scipy==1.15.1",
  "scikit-learn==1.6.1",
  "xgboost==2.1.4",
  "PyYAML==6.0.2",
  "rapidfuzz==3.12.1",
  "sparse-dot-topn==1.1.5",
  "sentence-transformers==3.4.1",
]

[project.optional-dependencies]
aws = ["boto3==1.36.26", "sagemaker==2.239.0"]
test = ["pytest==8.3.4", "nbformat==5.10.4", "nbclient==0.10.2"]

[project.scripts]
ber-pipeline = "ber.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
