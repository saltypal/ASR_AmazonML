AWSTemplateFormatVersion: '2010-09-09'
Description: Private S3 storage and an EC2 instance role for the Amazon ML Challenge pipeline.

Parameters:
  ProjectName:
    Type: String
    Default: amazonml-entity-resolution
  BucketName:
    Type: String
    Default: ''
    Description: Optional globally unique bucket name. Leave empty for an AWS-generated name.

Conditions:
  HasBucketName: !Not [!Equals [!Ref BucketName, '']]

Resources:
  ProjectBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !If [HasBucketName, !Ref BucketName, !Ref 'AWS::NoValue']
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: RemoveTemporaryRunFiles
            Prefix: runs/tmp/
            Status: Enabled
            ExpirationInDays: 7
            NoncurrentVersionExpiration:
              NoncurrentDays: 7
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  GpuInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-ec2-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ProjectBucketOnly
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:ListBucket
                  - s3:GetBucketLocation
                Resource: !GetAtt ProjectBucket.Arn
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:AbortMultipartUpload
                Resource: !Sub '${ProjectBucket.Arn}/*'

  GpuInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Sub '${ProjectName}-ec2-profile'
      Roles:
        - !Ref GpuInstanceRole

Outputs:
  BucketName:
    Value: !Ref ProjectBucket
  InstanceProfileName:
    Value: !Ref GpuInstanceProfile
  InstanceRoleArn:
    Value: !GetAtt GpuInstanceRole.Arn
